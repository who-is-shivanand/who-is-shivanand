<svg
  xmlns="http://www.w3.org/2000/svg"
  width="850"
  height="90"
  viewBox="0 0 850 90">

  <defs>

    <!-- ============================================== -->
    <!--                  RGB GRADIENT                 -->
    <!-- ============================================== -->

    <linearGradient
      id="rgbGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop
        offset="0%"
        stop-color="#00E5FF">

        <animate
          attributeName="stop-color"
          values="#00E5FF;#0066FF;#7C3AED;#EC4899;#FF1744;#FFEA00;#00FF88;#00E5FF"
          dur="8s"
          repeatCount="indefinite"/>

      </stop>

      <stop
        offset="50%"
        stop-color="#A855F7">

        <animate
          attributeName="stop-color"
          values="#A855F7;#EC4899;#FF1744;#FFEA00;#00FF88;#00E5FF;#0066FF;#A855F7"
          dur="8s"
          repeatCount="indefinite"/>

      </stop>

      <stop
        offset="100%"
        stop-color="#FF1744">

        <animate
          attributeName="stop-color"
          values="#FF1744;#FFEA00;#00FF88;#00E5FF;#0066FF;#7C3AED;#EC4899;#FF1744"
          dur="8s"
          repeatCount="indefinite"/>

      </stop>

    </linearGradient>


    <!-- ============================================== -->
    <!--                    SOFT GLOW                   -->
    <!-- ============================================== -->

    <filter
      id="softGlow"
      x="-50%"
      y="-100%"
      width="200%"
      height="300%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ============================================== -->
    <!--                   STRONG GLOW                  -->
    <!-- ============================================== -->

    <filter
      id="strongGlow"
      x="-50%"
      y="-100%"
      width="200%"
      height="300%">

      <feGaussianBlur
        stdDeviation="9"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ============================================== -->
    <!--                 GLASS BACKGROUND               -->
    <!-- ============================================== -->

    <linearGradient
      id="glass"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop
        offset="0%"
        stop-color="#020617"
        stop-opacity="0.75"/>

      <stop
        offset="50%"
        stop-color="#0F172A"
        stop-opacity="0.55"/>

      <stop
        offset="100%"
        stop-color="#020617"
        stop-opacity="0.75"/>

    </linearGradient>


    <!-- ============================================== -->
    <!--                  LIGHT SHINE                   -->
    <!-- ============================================== -->

    <linearGradient
      id="shine"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop
        offset="0%"
        stop-color="#FFFFFF"
        stop-opacity="0"/>

      <stop
        offset="50%"
        stop-color="#FFFFFF"
        stop-opacity="0.8"/>

      <stop
        offset="100%"
        stop-color="#FFFFFF"
        stop-opacity="0"/>

    </linearGradient>

  </defs>


  <!-- ============================================== -->
  <!--                 BACKGROUND PANEL               -->
  <!-- ============================================== -->

  <rect
    x="10"
    y="8"
    width="830"
    height="74"
    rx="18"
    fill="url(#glass)"/>


  <!-- ============================================== -->
  <!--               INITIALIZING                     -->
  <!-- ============================================== -->

  <g
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    text-anchor="middle"
    fill="url(#rgbGradient)"
    filter="url(#strongGlow)">

    <text
      x="425"
      y="56">

      Initializing Shivanand...

    </text>

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.10;0.85;1"
      dur="21s"
      begin="0s"
      repeatCount="indefinite"/>

  </g>


  <!-- ============================================== -->
  <!--              CSE STUDENT                       -->
  <!-- ============================================== -->

  <g
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    text-anchor="middle"
    fill="url(#rgbGradient)"
    filter="url(#strongGlow)">

    <text
      x="425"
      y="56">

      CSE (IoT &amp; CSBT) Student

    </text>

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.10;0.85;1"
      dur="21s"
      begin="3s"
      repeatCount="indefinite"/>

  </g>


  <!-- ============================================== -->
  <!--                 ARTIFICIAL INTELLIGENCE        -->
  <!-- ============================================== -->

  <g
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    text-anchor="middle"
    fill="url(#rgbGradient)"
    filter="url(#strongGlow)">

    <text
      x="425"
      y="56">

      Exploring Artificial Intelligence

    </text>

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.10;0.85;1"
      dur="21s"
      begin="6s"
      repeatCount="indefinite"/>

  </g>


  <!-- ============================================== -->
  <!--                 CYBERSECURITY                  -->
  <!-- ============================================== -->

  <g
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    text-anchor="middle"
    fill="url(#rgbGradient)"
    filter="url(#strongGlow)">

    <text
      x="425"
      y="56">

      Studying Cybersecurity

    </text>

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.10;0.85;1"
      dur="21s"
      begin="9s"
      repeatCount="indefinite"/>

  </g>


  <!-- ============================================== -->
  <!--                     IOT                        -->
  <!-- ============================================== -->

  <g
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    text-anchor="middle"
    fill="url(#rgbGradient)"
    filter="url(#strongGlow)">

    <text
      x="425"
      y="56">

      Building with IoT

    </text>

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.10;0.85;1"
      dur="21s"
      begin="12s"
      repeatCount="indefinite"/>

  </g>


  <!-- ============================================== -->
  <!--                  BLOCKCHAIN                    -->
  <!-- ============================================== -->

  <g
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    text-anchor="middle"
    fill="url(#rgbGradient)"
    filter="url(#strongGlow)">

    <text
      x="425"
      y="56">

      Exploring Blockchain

    </text>

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.10;0.85;1"
      dur="21s"
      begin="15s"
      repeatCount="indefinite"/>

  </g>


  <!-- ============================================== -->
  <!--                ALWAYS LEARNING                 -->
  <!-- ============================================== -->

  <g
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    text-anchor="middle"
    fill="url(#rgbGradient)"
    filter="url(#strongGlow)">

    <text
      x="425"
      y="56">

      System Status: Always Learning...

    </text>

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.10;0.85;1"
      dur="21s"
      begin="18s"
      repeatCount="indefinite"/>

  </g>


  <!-- ============================================== -->
  <!--                  MOVING SHINE                  -->
  <!-- ============================================== -->

  <rect
    x="-200"
    y="10"
    width="140"
    height="70"
    fill="url(#shine)"
    opacity="0.12"
    transform="skewX(-20)">

    <animate
      attributeName="x"
      from="-200"
      to="900"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ============================================== -->
  <!--                    RGB DOTS                    -->
  <!-- ============================================== -->

  <circle
    cx="100"
    cy="45"
    r="2.5"
    fill="#00E5FF"
    filter="url(#softGlow)">

    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="750"
    cy="45"
    r="2.5"
    fill="#EC4899"
    filter="url(#softGlow)">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="2.5s"
      repeatCount="indefinite"/>

  </circle>

</svg>
