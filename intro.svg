<svg
  width="850"
  height="90"
  viewBox="0 0 850 90"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!--                 RGB GRADIENT                      -->
    <!-- ================================================= -->

    <linearGradient
      id="rgb"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop offset="0%" stop-color="#00E5FF">

        <animate
          attributeName="stop-color"
          values="#00E5FF;#0066FF;#7C3AED;#EC4899;#FF1744;#FFEA00;#00FF88;#00E5FF"
          dur="7s"
          repeatCount="indefinite"
        />

      </stop>


      <stop offset="50%" stop-color="#A855F7">

        <animate
          attributeName="stop-color"
          values="#A855F7;#EC4899;#FF1744;#FFEA00;#00FF88;#00E5FF;#0066FF;#A855F7"
          dur="7s"
          repeatCount="indefinite"
        />

      </stop>


      <stop offset="100%" stop-color="#FF1744">

        <animate
          attributeName="stop-color"
          values="#FF1744;#FFEA00;#00FF88;#00E5FF;#0066FF;#7C3AED;#EC4899;#FF1744"
          dur="7s"
          repeatCount="indefinite"
        />

      </stop>

    </linearGradient>


    <!-- ================================================= -->
    <!--                    NEON GLOW                      -->
    <!-- ================================================= -->

    <filter
      id="neon"
      x="-50%"
      y="-100%"
      width="200%"
      height="300%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur1"
      />

      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="2"
        result="blur2"
      />

      <feMerge>

        <feMergeNode in="blur1"/>

        <feMergeNode in="blur2"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ================================================= -->
    <!--                 STRONG RGB GLOW                  -->
    <!-- ================================================= -->

    <filter
      id="strongGlow"
      x="-50%"
      y="-100%"
      width="200%"
      height="300%">

      <feGaussianBlur
        stdDeviation="9"
        result="blur"
      />

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ================================================= -->
    <!--                    SHINE                          -->
    <!-- ================================================= -->

    <linearGradient
      id="shine"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop
        offset="0%"
        stop-color="white"
        stop-opacity="0"
      />

      <stop
        offset="50%"
        stop-color="white"
        stop-opacity="0.8"
      />

      <stop
        offset="100%"
        stop-color="white"
        stop-opacity="0"
      />

    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!--                  SUBTLE BACKGROUND                -->
  <!-- ================================================= -->

  <rect
    x="20"
    y="10"
    width="810"
    height="65"
    rx="18"
    fill="#020617"
    opacity="0.35"
  />


  <!-- ================================================= -->
  <!--                  OUTER RGB GLOW                   -->
  <!-- ================================================= -->

  <text
    x="425"
    y="55"
    text-anchor="middle"
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    fill="url(#rgb)"
    opacity="0.45"
    filter="url(#strongGlow)">

    CSE (IoT &amp; CSBT) Student

  </text>


  <!-- ================================================= -->
  <!--                   MAIN TEXT                       -->
  <!-- ================================================= -->

  <text
    x="425"
    y="55"
    text-anchor="middle"
    font-family="Fira Code, Consolas, monospace"
    font-size="22"
    font-weight="600"
    letter-spacing="1"
    fill="url(#rgb)"
    filter="url(#neon)">

    CSE (IoT &amp; CSBT) Student

  </text>


  <!-- ================================================= -->
  <!--                  MOVING SHINE                     -->
  <!-- ================================================= -->

  <rect
    x="-250"
    y="15"
    width="180"
    height="50"
    fill="url(#shine)"
    opacity="0.25"
    transform="skewX(-20)">

    <animate
      attributeName="x"
      from="-250"
      to="900"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ================================================= -->
  <!--                SMALL RGB DOTS                     -->
  <!-- ================================================= -->

  <circle
    cx="180"
    cy="55"
    r="2"
    fill="#00E5FF"
    filter="url(#neon)">

    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      repeatCount="indefinite"
    />

  </circle>


  <circle
    cx="670"
    cy="55"
    r="2"
    fill="#EC4899"
    filter="url(#neon)">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="2.5s"
      repeatCount="indefinite"
    />

  </circle>

</svg>
